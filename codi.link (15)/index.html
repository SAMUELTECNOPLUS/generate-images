<!DOCTYPE html>
<html lang="en">
  <head>
    <link type="text/css" rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>IA Image Generate</title>
    <link rel="stylesheet" href="style.css" />
    <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
  </head>
  <body>


<!--- CONTAINER --->


<!--Title-->
<main class="container-secondary">
<h1 class="title">
  <i class='bx  bxs-magic-wand' id="title__icon1"></i> 
    <span class="title__text">IA Image Generate</span>
</h1>

<section class="container-primary">


<div class="form-and-image">
  <!--FORM CONTAINER--->
  <section class="form-container">
    <!---PROMPT INPUT-->
    <textarea class="form-container__prompt-input" rows="5" placeholder="Describe your image..." id="prompt"></textarea>
    <div class="form-container__dropdown-group">

    <!---DROPDOWM STYLE--->
    <select class="form-container__dropdown" id="dropdowmStyle">
        <option value="">Select a style</option>
        <option value="31">Anime</option>
        <option value="122">Photographic</option>
        <option value="125">3D Model</option>
        <!-- etc... -->
    </select>

 <!---DROPDOWM RATIO--->
    <select class="form-container__dropdown"  id="dropdowmRatio"> 
      <option value="1:1">1:1</option>
      <option value="16:9">16:9</option>
      <option value="9:16">9:16</option>
    </select>
    </div>  
    
    <!---GENERATE BUTTON--->

  <button class="form-container__button" onclick="generateImage()"> 
  <i class='bx  bxs-magic-wand' id="title__icon1"></i> 
 Generate Button
</button>



  </section>




    <!--IMAGE CONTAINER--->
<section class="image-container" id="imageContainer">

<!---IMAGE GENERATE--->
<img  class="image-container__image-result" id="imageResult"
   src="https://picsum.photos/200/300">


<div class="image-container__layer">
  <button class="image-container__download-button">
  <i class='bx  bx-arrow-to-bottom-stroke'></i> 
</button>
<button class="image-container__fullscreen-button" id="fullscreenBtn">
  <i class='bx  bx-maximize'></i> 

</button></div>


<!---LOADING CONTAINER--->
<div class="image-container__loading-container">
  <svg class="image-container__loading-spiner"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><radialGradient id="a12" cx=".66" fx=".66" cy=".3125" fy=".3125" gradientTransform="scale(1.5)"><stop offset="0" stop-color="#000000"></stop><stop offset=".3" stop-color="#000000" stop-opacity=".9"></stop><stop offset=".6" stop-color="#000000" stop-opacity=".6"></stop><stop offset=".8" stop-color="#000000" stop-opacity=".3"></stop><stop offset="1" stop-color="#000000" stop-opacity="0"></stop></radialGradient><circle transform-origin="center" fill="none" stroke="url(#a12)" stroke-width="15" stroke-linecap="round" stroke-dasharray="200 1000" stroke-dashoffset="0" cx="100" cy="100" r="70"><animateTransform type="rotate" attributeName="transform" calcMode="spline" dur="2" values="360;0" keyTimes="0;1" keySplines="0 0 1 1" repeatCount="indefinite"></animateTransform></circle><circle transform-origin="center" fill="none" opacity=".2" stroke="#000000" stroke-width="15" stroke-linecap="round" cx="100" cy="100" r="70"></circle></svg>
  <div class="image-container__loading-text"> Generating Image...</div>
</div>

</section>
</div>
</section>
</main>


<script   src="script.js"></script>
  </body>
</html>

    <script type="module" src="script.js"></script>
  </body>
</html>
